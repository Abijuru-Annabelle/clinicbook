spring.application.name=clinicbook
server.port=8080

# Local secrets (DB password) live in secrets.properties, which is NOT committed to Git
spring.config.import=optional:file:./secrets.properties

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/clinicbook
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Tables are created from schema.sql (keeps the exact PKs, FKs, CHECKs and indexes from the design)
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ---------- MongoDB ----------
spring.data.mongodb.uri=mongodb://localhost:27017/clinicbook
spring.data.mongodb.auto-index-creation=true

# ---------- File uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- App ----------
app.frontend-url=http://localhost:5173
app.jwt.secret=${JWT_SECRET:VPBHMLsFJx7fe4jeX+4oLYvUXIQoSft/HVzXmERFFtcmUMoEdGY8GRbgpe+2rAp/}
app.jwt.expiry-minutes=60
app.default-doctor-password=Doctor@123

# ---------- RabbitMQ ----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# A failing message is retried 3 times, then sent to the dead-letter queue
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------- Email ----------
# Without spring.mail.* settings, emails are simulated (logged + saved in MongoDB).
# To send real emails, put spring.mail.host/port/username/password in secrets.properties.
app.mail.from=no-reply@clinicbook.rw

# ---------- Google OAuth2 login (real values live in secrets.properties) ----------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:set-in-secrets.properties}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:set-in-secrets.properties}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ---------- Performance ----------
spring.cache.type=caffeine
spring.cache.cache-names=departments,doctors,doctor
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
