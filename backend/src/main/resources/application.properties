spring.application.name=clinicbook
server.port=8080

# Local secrets (DB password) live in secrets.properties, which is NOT committed to Git
spring.config.import=optional:file:./secrets.properties

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/clinicbook
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Tables are created from schema.sql (keeps the exact PKs, FKs, CHECKs and indexes from the design)
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ---------- App ----------
app.frontend-url=http://localhost:5173
app.jwt.secret=${JWT_SECRET:VPBHMLsFJx7fe4jeX+4oLYvUXIQoSft/HVzXmERFFtcmUMoEdGY8GRbgpe+2rAp/}
app.jwt.expiry-minutes=60
app.default-doctor-password=Doctor@123

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
